version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.pgvector
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      # Mount the whole init/ folder — scripts run in alphabetical order:
      #   01_documents.sql  → creates documents table (existing schema)
      #   02_chunks.sql     → creates chunks table + vector indexes
      - ./init:/docker-entrypoint-initdb.d
