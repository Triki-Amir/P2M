version: '3.8'

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio_server
    ports:
      - "9000:9000" # API Port (What your code will use)
      - "9001:9001" # Console Port (What you'll use in the browser)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"